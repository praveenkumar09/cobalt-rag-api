server.port=8083
spring.application.name=cobalt-rag-api
spring.profiles.active=local

# ── OpenAI ────────────────────────────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.options.model=text-embedding-3-small

# ── PostgreSQL / pgvector ──────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ingestor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Neo4j ─────────────────────────────────────────────────────────────────────
cobalt.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
cobalt.neo4j.username=${NEO4J_USER:neo4j}
cobalt.neo4j.password=${NEO4J_PASS:admin}

# ── RAG tuning ────────────────────────────────────────────────────────────────
cobalt.rag.top-k=5
cobalt.rag.graph-context-limit=25
# Minimum cosine similarity (0-1) a retrieved chunk must score to be used as context
# or shown as a source citation. Chunks below this are dropped, so off-topic questions
# yield no citations. Tune based on observed similarity scores for real vs. irrelevant questions.
cobalt.rag.similarity-threshold=0.35