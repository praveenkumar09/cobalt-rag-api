server.port=8083
spring.application.name=cobalt-rag-api
spring.profiles.active=local

# ── Actuator / Prometheus ───────────────────────────────────────────────────────
# Only health + prometheus are exposed (not the full actuator surface, which
# can leak env/config details) — scraped by the prometheus service in
# docker-compose.yml at /actuator/prometheus.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
# Percentile histograms for the custom llm.calls timer and the built-in HTTP
# server timer, so Grafana can chart p95/p99 latency instead of just an average.
management.metrics.distribution.percentiles-histogram.llm.calls=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ── OpenAI ────────────────────────────────────────────────────────────────────
# Single source of truth for the chat model — every chatModel.call() site (main
# answer, business/technical rules, decision table, data dictionary, follow-ups,
# starter suggestions) reads its model/temperature/seed from here via the shared
# ChatModel bean. OrderedOpenAiStreamClient (the streaming answer path, which
# bypasses ChatModel — see its own Javadoc) reads these exact same three keys
# directly, with no Java-side default of its own, so this file is the only place
# that needs to change when the model is swapped/deprecated.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
# 0.0 + a fixed seed = OpenAI's best-effort deterministic sampling: the same
# question reliably produces the same (or near-identical) answer, instead of
# the run-to-run variance a positive temperature introduces. OpenAI documents
# this as "mostly consistent," not a 100% guarantee, since some randomness can
# still come from their own infra — but it's a large, real reduction from 0.3.
spring.ai.openai.chat.options.temperature=0.0
spring.ai.openai.chat.options.seed=42
spring.ai.openai.embedding.options.model=text-embedding-3-large
# Native output size of text-embedding-3-large (no truncation). Must match
# cobol-ingestor-api's openai.embed.dims and the `chunks.embedding` pgvector
# column (vector(3072)) — both services read/write the same shared column,
# so model + dimension have to stay identical on both sides.
spring.ai.openai.embedding.options.dimensions=3072

# ── PostgreSQL / pgvector ──────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ingestor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Neo4j ─────────────────────────────────────────────────────────────────────
cobalt.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
cobalt.neo4j.username=${NEO4J_USER:neo4j}
cobalt.neo4j.password=${NEO4J_PASS:admin}

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Session cache-aside TTL (seconds), independent of AuthStore's own 30-day
# Postgres session TTL — see AuthStore's Javadoc for why a short TTL alone
# (rather than a full secondary index of every token) is an acceptable bound
# on staleness after logout/resetPassword.
cobalt.redis.session-cache-ttl-seconds=300
# Fixed-window length (seconds) for the Redis-backed /api/ask rate limiter —
# matches AskRateLimiter's previous hardcoded 60s window.
cobalt.redis.rate-limit.window-seconds=60
# Chat memory: how many prior Q+A turns (one turn = one user + one assistant
# message) are cached per conversation and injected into the prompt. No
# summarization — a hard cap is the entire bounding strategy for now.
cobalt.rag.chat-memory.max-turns=8
# TTL (seconds) for the cached turn list — tracks ConversationStore's own
# 1-day expiry-after-last-activity policy so the cache and the Postgres
# source of truth go stale together.
cobalt.rag.chat-memory.ttl-seconds=86400

# ── RAG tuning ────────────────────────────────────────────────────────────────
# Final number of chunks actually handed to the answer prompt, after RerankService
# narrows down the wider hybrid-retrieval candidate pool (see candidate-pool-size
# below) — no longer the raw SQL LIMIT it used to be.
cobalt.rag.top-k=5
# How many candidates EACH retrieval method (vector search on the question,
# vector search on its HyDE expansion, keyword search) contributes before
# Reciprocal Rank Fusion merges them and RerankService narrows the merged pool
# down to top-k. Wider than top-k on purpose — see VectorSearchService's Javadoc.
cobalt.rag.retrieval.candidate-pool-size=20
# Max relationships PER DIRECTION (outgoing "calls" and incoming "called by"
# are each traced and capped independently — see GraphSearchService — so a
# program with far more callees than callers, or vice versa, can't crowd the
# other direction out of the result).
cobalt.rag.graph-context-limit=25
# How many hops to trace in each direction — not just the seed program's
# direct callers/callees, but the whole chain up to this many hops out.
cobalt.rag.graph-max-hops=4
# Caps the number of PATHS Neo4j explores per direction (before flattening
# into edges), independent of graph-context-limit — protects against
# combinatorial blow-up in a densely connected graph at higher hop counts.
cobalt.rag.graph-path-limit=100
# Minimum cosine similarity (0-1) a retrieved chunk must score to be used as context
# or shown as a source citation. Chunks below this are dropped, so off-topic questions
# yield no citations. Tune based on observed similarity scores for real vs. irrelevant questions.
cobalt.rag.similarity-threshold=0.35
# Max requests per caller (per resolved user, or per IP if unauthenticated) to
# /api/ask and /api/ask/formal, per rolling 60-second window. Protects against
# a scripted flood (e.g. repeated prompt-injection attempts) — see AskRateLimiter.
cobalt.rag.rate-limit.requests-per-minute=20