# Postgres + Neo4j are owned by cobol-ingestor-api/docker-compose.yml, on the
# `cobalt-shared` network it creates — bring that stack up FIRST (`cd
# ../cobol-ingestor-api && docker compose up -d`), then this one. cobalt-rag-api
# connects to it as a client (env vars below) rather than running its own
# copies, so ingestion and the RAG API always read/write the same database.
# cobalt-rag-api's own tables (users, sessions, conversations, feedback,
# security_events) still self-provision automatically on first boot via each
# store's @PostConstruct — no separate schema step needed on this side.
networks:
  cobalt-shared:
    external: true

services:

  # ── Cobalt RAG API ────────────────────────────────────────────────────────────
  cobalt-rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobalt_rag_api
    ports:
      - "8083:8083"
    networks:
      - default
      - cobalt-shared
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ingestor
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: admin
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: cobalt_prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      cobalt-rag-api:
        condition: service_healthy

  # ── Grafana ───────────────────────────────────────────────────────────────────
  # Anonymous viewer access + embedding allowed: this is an internal tool with no
  # admin-role concept yet (see AuthStore's Javadoc), and /stats in cobalt-chat-ui
  # iframes this dashboard directly rather than asking users to log into Grafana
  # separately.
  grafana:
    image: grafana/grafana:latest
    container_name: cobalt_grafana
    networks:
      - default
      - cobalt-shared
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: dark
      # Removes the "Powered by Grafana" attribution link — in kiosk mode (no
      # normal app chrome) it renders position-fixed to the iframe's own
      # viewport bottom rather than after the dashboard content, so it was
      # landing on top of whichever row happened to be last (the Security row).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards/json
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data: